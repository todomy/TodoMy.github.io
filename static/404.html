<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>404 - 页面不存在</title>
    <style>
        body{box-sizing:border-box;min-width:200px;max-width:900px;margin:20px auto;padding:45px;font-size:16px;font-family:sans-serif;line-height:1.5;text-align:center;}
        .code{font-size:88px;font-weight:bold;color:#0969da;letter-spacing:8px;}
        .msg{font-size:20px;margin:16px 0 8px;color:#1f2328;}
        .tip{font-size:14px;color:#656d76;margin-bottom:32px;}
        .btn{display:inline-block;padding:10px 24px;border:1px solid #d0d7de;border-radius:6px;text-decoration:none;color:#0969da;font-size:15px;}
        .btn:hover{background:#0969da;color:#fff;border-color:#0969da;}
        @media (prefers-color-scheme: dark){body{background:#0d1117;color:#e6edf3;}.msg{color:#e6edf3;}.tip{color:#8b949e;}.btn{border-color:#30363d;color:#58a6ff;}.btn:hover{background:#58a6ff;color:#0d1117;}.code{color:#58a6ff;}}
    </style>
</head>
<body>
    <div class="code">404</div>
    <div class="msg">页面不存在或已移动</div>
    <div class="tip">你要找的内容可能被删了，或者地址打错了</div>
    <a class="btn" href="/">← 回到博客首页</a>
</body>
</html>
