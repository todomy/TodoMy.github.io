name: build Gmeek

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Gmeek.py'
      - 'config.json'
      - 'requirements.txt'
      - 'templates/**'
      - 'static/**'
      - 'plugins/**'
      - '.github/workflows/Gmeek.yml'
  issues:
    types: [opened, edited, closed, deleted]

jobs:
  build:
    name: Generate blog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write
      issues: read
      pages: write
    concurrency:
      group: gmeek-build
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 完整历史，保证产物提交 rebase 时能找到共同祖先

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Show config.json
        run: |
          echo "====== check config.json file ======"
          cat config.json
          echo "====== check config.json end ======"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate new html
        run: |
          python Gmeek.py ${{ secrets.GITHUB_TOKEN }} ${{ github.repository }} --issue_number '${{ github.event.issue.number }}'

      - name: update html
        run: |
          git config --local user.email "62632079+todomy@users.noreply.github.com"
          git config --local user.name "${{ github.repository_owner }}"
          git add .
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m '🎉auto update by Gmeek action'
            git pull --rebase origin main
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/.'

  deploy:
    name: Deploy blog
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
