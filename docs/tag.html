    <style>
    body{box-sizing: border-box;min-width: 200px;max-width: 900px;margin: 20px auto;padding: 45px;font-size: 16px;font-family: sans-serif;line-height: 1.25;}
    #header{display:flex;padding-bottom:8px;border-bottom: 1px solid var(--borderColor-muted, var(--color-border-muted));margin-bottom: 16px;}
    #footer {margin-top:64px; text-align: center;font-size: small;}
    /* 页脚链接：样式只作用于页脚内部 */
    #footer a{text-decoration: none;color: var(--color-accent-fg, #0969da);transition: font-weight 0.3s ease;}
    #footer a:hover{ font-weight: bold; }
    /* 返回顶部按钮 - 简洁优雅版，配色跟随站点主题 */
    .circle-button{position: fixed;bottom: 30px;right: 30px;width: 50px;height: 50px;background-color: var(--color-canvas-overlay, rgba(255,255,255,.9));color: var(--color-fg-default, #333);border-radius: 50%;display: flex;justify-content: center;align-items: center;cursor: pointer;font-size: 22px;font-weight: 300;box-shadow: 0 4px 12px rgba(0,0,0,.12);border: 1px solid var(--color-border-default, transparent);transition: transform 280ms ease-out, box-shadow 280ms ease-out, opacity 280ms ease-out, visibility 280ms ease-out;opacity: 0;visibility: hidden;z-index: 9999;}
    .circle-button.visible{opacity: 1;visibility: visible;}
    .circle-button:hover{transform: translateY(-4px) scale(1.05);box-shadow: 0 8px 16px rgba(0,0,0,.15);}
    .circle-button:active{transform: translateY(-2px) scale(0.98);box-shadow: 0 4px 8px rgba(0,0,0,.12);}
    @media (max-width: 768px){.circle-button{width: 45px;height: 45px;font-size: 20px;bottom: 20px;right: 20px;}}
    /* 返回上一页按钮 - 仅文章/阅读页显示，与回顶部按钮上下成组；独立 class，不改动 .circle-button */
    .back-button{position: fixed;bottom: 90px;right: 30px;width: 50px;height: 50px;background-color: var(--color-canvas-overlay, rgba(255,255,255,.9));color: var(--color-fg-default, #333);border-radius: 50%;display: flex;justify-content: center;align-items: center;cursor: pointer;font-size: 26px;font-weight: 300;box-shadow: 0 4px 12px rgba(0,0,0,.12);border: 1px solid var(--color-border-default, transparent);transition: transform 280ms ease-out, box-shadow 280ms ease-out, opacity 280ms ease-out, visibility 280ms ease-out;opacity: 0;visibility: hidden;z-index: 9999;}
    .back-button.visible{opacity: 1;visibility: visible;}
    .back-button:hover{transform: translateY(-4px) scale(1.05);box-shadow: 0 8px 16px rgba(0,0,0,.15);}
    .back-button:active{transform: translateY(-2px) scale(0.98);box-shadow: 0 4px 8px rgba(0,0,0,.12);}
    @media (max-width: 768px){.back-button{width: 45px;height: 45px;font-size: 22px;bottom: 80px;right: 20px;}}
    /* 无障碍：系统开启减少动态效果时，关闭全部过渡与动画 */
    @media (prefers-reduced-motion: reduce){
        *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}
    }
    </style>
    
<style>
.tagTitle{margin:auto 0;font-size:40px;font-weight:bold;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.title-right{display:flex;margin:auto 0 0 auto;}
.title-right .circle{padding: 14px 16px;margin-right:8px;}

.subnav-search{width:222px;margin-top:8px;margin-right:8px;}
.subnav-search-input{width:160px;border-top-right-radius:0px;border-bottom-right-radius:0px;}
.subnav-search button{padding:5px 8px;border-top-left-radius:0px;border-bottom-left-radius:0px;}

.SideNav-icon{margin-right:16px}
.Label{margin-left:4px;}
.LabelName a{color:inherit;}
.LabelMeta{color:var(--color-fg-muted,#6B7280);background-color:var(--color-canvas-subtle,#F1F3F5);}
/* 日期框固定宽度+文字居中：与首页一致，不依赖字体 tnum 特性 */
.LabelTime{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:88px;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
#taglabel .Label {margin-bottom:8px;}
.Counter{color:var(--color-fg-muted,#6B7280);background-color:rgba(175,184,193,.35)}

.genTime{float: right;}
.d-flex{min-width:0;}
.listTitle{overflow:hidden;white-space:nowrap;text-overflow: ellipsis;max-width: 100%;}
.listLabels{white-space:nowrap;}

/* 动效规范：微反馈130ms / 主交互200ms / 出入场280ms，统一 ease-out（与首页一致） */
#header a{transition: transform 130ms ease-out;}
#header a:hover{transform: scale(1.05);}

/* 列表项：聚焦式浮起——与首页统一，不缩放文字，用背景+色条+标题变粗+上浮阴影表达聚焦 */
.SideNav-item{position: relative;z-index:0;transition: background-color 200ms ease-out, box-shadow 200ms ease-out, transform 200ms ease-out;}
.SideNav-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background-color:var(--color-accent-fg, #0969da);opacity:0;transition:opacity 200ms ease-out;}
.SideNav-item:hover{background-color:var(--color-canvas-subtle, rgba(175,184,193,.15));box-shadow:0 6px 16px rgba(0,0,0,.14);transform:translateY(-2px);z-index:1;text-decoration:none;}
.SideNav-item:hover::before{opacity:1;}
.SideNav-item:hover .listTitle{font-weight:700;}
/* 按下的确认感 + 键盘焦点可见 */
.SideNav-item:active{background-color:var(--color-canvas-inset, rgba(175,184,193,.25));}
.SideNav-item:focus-visible{outline:2px solid var(--color-accent-fg, #0969da);outline-offset:-2px;}

@media (max-width: 600px) {
    body { padding: 8px;}
    .tagTitle{display:none;}
    .LabelTime{display:none;}
}
</style>

</head>

<script>
(function(){
    var now = new Date();
    document.getElementById("copyrightYear").textContent = now.getFullYear();

    if ("11/24/2024" != "") {
        var startSite = new Date("11/24/2024");
        var diff = now.getTime() - startSite.getTime();
        var diffDay = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById("runday").textContent = "\u7f51\u7ad9\u8fd0\u884c" + diffDay + "\u5929" + " • ";
    }

    // 返回顶部
    function scrollToTop(){
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    window.scrollToTop = scrollToTop;

    // 按钮显隐
    var btn = document.querySelector('.circle-button');
    window.addEventListener('scroll', function(){
        if (window.scrollY > 300) { btn.classList.add('visible'); }
        else { btn.classList.remove('visible'); }
    });

    // 返回上一页（方案C：站内来源用 history.back 保留滚动位置，外部/直达回首页）
    var backBtn = document.querySelector('.back-button');
    if (backBtn) {
        var goBack = function(){
            var home = "https://todomy.github.io";
            var ref = document.referrer || '';
            var homeHost = '';
            try { homeHost = new URL(home).hostname; } catch (e) {}
            var refHost = '';
            if (ref) {
                try { refHost = new URL(ref).hostname; }
                catch (e) { refHost = ''; }
            }
            if (refHost && refHost === homeHost && window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = home;
            }
        };
        backBtn.addEventListener('click', goBack);
        backBtn.addEventListener('keydown', function(e){
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goBack(); }
        });
    }
})();
</script></div>

        "dark": ["dark","moon","#00f0ff","dark-blue"],

            changeTheme(...themeSettings[newMode]);

<script>
document.getElementById("pathHome").setAttribute("d",IconList["home"]);
document.getElementById("searchSVG").setAttribute("d",IconList["search"]);

tagList=[];
labelsCount={};
jsonData='';
let requestJson="postList.json"
let request=new XMLHttpRequest();
request.open("GET",requestJson);
request.responseType='text';
request.send();
request.onload=function(){
    jsonData=JSON.parse(request.response);
    console.log(jsonData);
    showList(labelsCount);
    setClassDisplay(decodeURI(window.location.hash.slice(1)));
}

function showList(labelsCount){
    let SideNav=document.getElementsByClassName("SideNav")[0];
    SideNav.classList.add("border");
    let taglabel=document.getElementById("taglabel");

    let metaColor=(jsonData['metaLabelColor']&&jsonData['metaLabelColor']['color'])||'#6B7280';
    let metaBg=(jsonData['metaLabelColor']&&jsonData['metaLabelColor']['bg'])||'#F1F3F5';
    jsonData['labelColorDict']["All"]=metaColor;
    if(!jsonData['labelBgDict'])jsonData['labelBgDict']={};
    jsonData['labelBgDict']["All"]=metaBg;
    labelsCount["All"]=0;
    for (let key in jsonData) {
        if (key !== 'labelColorDict' && Array.isArray(jsonData[key]['labels'])) {
            labelsCount["All"]++;
            for (let label of jsonData[key]['labels']) {
                labelsCount[label] = (labelsCount[label] || 0) + 1;
            }
        }
    }

    let sortedLabelsList = Object.keys(labelsCount).sort((a, b) => labelsCount[b] - labelsCount[a]);
    for (let label of sortedLabelsList) {
        tagList.push(label);
        let showLabels = document.createElement("button");
        showLabels.setAttribute("class", "Label");
        showLabels.setAttribute("style", "color:" + jsonData['labelColorDict'][label]+";background-color:" + (jsonData['labelBgDict'][label]||'#F1F3F5')+";padding:4px;");
        showLabels.textContent="\u00a0\u00a0"+label+" ";
        showLabels.addEventListener("click", function(){ updateShowTag(label); });

        let LabelNum=document.createElement("span");
        LabelNum.setAttribute("class","Counter");
        LabelNum.textContent=labelsCount[label];
        showLabels.appendChild(LabelNum);
        taglabel.appendChild(showLabels);
    }

    for(i in jsonData){
        if(i!='labelColorDict' && i!='labelBgDict' && i!='metaLabelColor' && Array.isArray(jsonData[i]['labels'])){
            let div=document.createElement("div");
            div.setAttribute("class","lists "+jsonData[i]['labels'].join(" "));
            div.setAttribute("data-content", jsonData[i]['content'] || '');

            let item=document.createElement("a");
            item.setAttribute("class","SideNav-item d-flex flex-items-center flex-justify-between");
            item.setAttribute("href",jsonData[i]['postUrl']);

            let center=document.createElement("div");
            center.setAttribute("class","d-flex flex-items-center");

            svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
            path=document.createElementNS("http://www.w3.org/2000/svg","path"); 
            span=document.createElement("span");
            svg.setAttributeNS(null,"class","SideNav-icon octicon");
            svg.setAttributeNS(null,"style","width:16px;height:16px");
            path.setAttributeNS(null, "d", IconList["post"]);
            svg.appendChild(path);

            let title=document.createElement("span");
            title.setAttribute("class","listTitle");
            title.textContent=jsonData[i]['postTitle'];
            center.appendChild(svg);
            center.appendChild(title);

            let listLabels=document.createElement("div");
            listLabels.setAttribute("class","listLabels");
            
            for(label of jsonData[i]['labels']){
                let LabelName=document.createElement("span");
                LabelName.setAttribute("class","Label LabelName");
                LabelName.setAttribute("style","color:"+jsonData['labelColorDict'][label]+";background-color:"+(jsonData['labelBgDict'][label]||'#F1F3F5'));
                LabelName.textContent=label;
                listLabels.appendChild(LabelName);
            }
            let LabelTime=document.createElement("span");
            LabelTime.setAttribute("class","Label LabelTime LabelMeta");
            LabelTime.textContent=jsonData[i]['createdDate'];
            listLabels.appendChild(LabelTime);

            item.appendChild(center);
            item.appendChild(listLabels);
            div.appendChild(item);
            SideNav.appendChild(div);
        }
    }
}

function updateShowTag(label){
    if(window.location.hash.slice(1)!=encodeURI(label)){
        window.location.hash="#"+(label);
        setClassDisplay(label);
    }
}

function setClassDisplay(label){
    let lists = document.getElementsByClassName("lists");
    let tagTitle = document.getElementsByClassName("tagTitle")[0];
    tagTitle.textContent="Tag #"+label;
    document.title=label+" - "+"TodoMy";
    document.getElementsByClassName("subnav-search-input")[0].value='';
    if(label=="All"){
        for(let i = 0; i < lists.length; i++){lists[i].style.display='block';}
        document.getElementsByClassName("notFind")[0].style.display='none';
    }
    else if(tagList.indexOf(label)!=-1){
        for(let i = 0; i < lists.length; i++){
            lists[i].style.display='none';
        }

        let labels = document.getElementsByClassName(label);
        for(let i = 0; i < labels.length; i++){
            labels[i].style.display='block';
        }
        document.getElementsByClassName("notFind")[0].style.display='none';
    }
    else{
        document.getElementsByClassName("subnav-search-input")[0].value=label;
        searchShow();
    }
}

function searchShow(){
    let lists = document.getElementsByClassName("lists");
    let tagTitle = document.getElementsByClassName("tagTitle")[0];
    let searchInput = document.getElementsByClassName("subnav-search-input")[0].value;
    tagTitle.textContent="Search #"+searchInput;
    if(searchInput==''){document.title="Search - "+"TodoMy";}
    else{document.title=searchInput+" - "+"TodoMy";}
    let a=0;
    window.location.hash="#"+(searchInput);
    
    // 转换为大写以进行不区分大小写的搜索
    let searchTerm = searchInput.toUpperCase();
    
    for(let i = 0; i < lists.length; i++){
        let item = lists[i];
        let titleElement = item.childNodes[0].childNodes[0].childNodes[1];
        let titleText = titleElement ? titleElement.textContent.toUpperCase() : '';
        
        // 获取文章内容（从data-content属性中）
        let contentText = item.getAttribute('data-content') || '';
        contentText = contentText.toUpperCase();
        
        // 同时搜索标题和内容
        if(titleText.indexOf(searchTerm) !== -1 || contentText.indexOf(searchTerm) !== -1){
            item.style.display='block';
            a++;
        } else {
            item.style.display='none';
        }
    }
    
    if(a==0){
        let notFind=document.getElementsByClassName("notFind")[0];
        notFind.style.display='block';
        notFind.textContent='Not Find "'+searchInput+'"';
    }
    else{document.getElementsByClassName("notFind")[0].style.display='none';}
}

</script>
