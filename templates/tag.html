{% extends 'base.html' %}
{% block head %}
<title>{{ i18n['Search'] }} - {{ title }}</title>
<script src="/assets/performance.js" defer></script>
{% endblock %}

{% block style %}
<style>
  .tagTitle{font-size:24px;font-weight:600;margin:0 0 16px}
  .search-bar{display:flex;gap:8px;margin-bottom:20px}
  .search-bar input{flex:1;padding:8px 12px;font-size:16px;border:1px solid var(--color-border-default,#d0d7de);border-radius:6px;
    background:var(--color-canvas-default,#fff);color:var(--color-fg-default,#24292f)}
  .tag-buttons{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
  .tag-buttons .Label{cursor:pointer}
  .listTitle{font-size:15px;max-width:540px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .listLabels{display:flex;gap:4px;align-items:center}
  .notFind{color:var(--color-fg-muted,#57606a);padding:24px 0}
</style>
{% endblock %}

{% block header %}
<h1 class="tagTitle">Loading<span class="AnimatedEllipsis"></span></h1>
<div class="search-bar">
  <input class="subnav-search-input" type="text" placeholder="{{ i18n['Search'] }}…" onkeydown="if(event.key==='Enter')searchShow()">
  <button class="btn" onclick="searchShow()">{{ i18n['Search'] }}</button>
</div>
<div class="title-right">
  <a class="tool-btn" href="{{ homeUrl }}" title="{{ i18n['home'] }}"><svg class="tool-icon" viewBox="0 0 16 16"><path id="pathHome" d=""></path></svg></a>
  {% if themeMode != 'fix' %}
  <span class="tool-btn" onclick="modeSwitch()" title="{{ i18n['switchTheme'] }}"><svg class="tool-icon" viewBox="0 0 16 16"><path id="themeSwitch" d=""></path></svg></span>
  {% endif %}
</div>
{% endblock %}

{% block content %}
<div class="tag-buttons" id="taglabel"></div>
<nav class="SideNav border" id="postList"></nav>
<div class="notFind" id="notFind" style="display:none"></div>
{% endblock %}

{% block script %}
<script>
  var SITE_TITLE={{ title|e }};
  var I18N={notFind:"{{ i18n['notFind'] }}",search:"{{ i18n['Search'] }}",loadMore:"{{ i18n['loadMore'] }}",viewMore:"{{ i18n['viewMore'] }}"};
  var HOME_URL="{{ homeUrl }}";
  var ICON_POST={{ IconList['post']|e }};
  var jsonData={},tagList=[],labelsCount={},originalKeys=[];

  fetch('postList.json').then(function(r){return r.json();}).then(function(d){
    jsonData=d;
    buildList();
    setClassDisplay(decodeURIComponent(window.location.hash.slice(1))||'All');
  }).catch(function(e){
    document.getElementById('postList').innerHTML='<p>数据加载失败</p>';
  });

  function buildList(){
    var taglabel=document.getElementById('taglabel');
    var list=document.getElementById('postList');
    var colors=jsonData['labelColorDict']||{};
    colors['All']='#24292f';
    labelsCount['All']=0;
    for(var k in jsonData){
      if(k==='labelColorDict'||!Array.isArray(jsonData[k]['labels']))continue;
      originalKeys.push(k);
      labelsCount['All']++;
      (jsonData[k]['labels']||[]).forEach(function(label){labelsCount[label]=(labelsCount[label]||0)+1;});
    }
    Object.keys(labelsCount).sort(function(a,b){return labelsCount[b]-labelsCount[a];}).forEach(function(label){
      tagList.push(label);
      var b=document.createElement('button');
      b.className='Label';
      b.style.background=(colors[label]||'#666'); b.style.padding='4px 8px'; b.style.cursor='pointer';
      b.innerHTML='&nbsp;'+esc(label)+' <span class="Counter">'+labelsCount[label]+'</span>';
      b.onclick=function(){updateShowTag(label);};
      taglabel.appendChild(b);
    });
    originalKeys.forEach(function(k){
      var p=jsonData[k];
      var row=document.createElement('div');
      row.className='lists '+(p['labels']||[]).join(' ');
      row.setAttribute('data-content',p['content']||'');
      var a=document.createElement('a');
      a.className='SideNav-item d-flex flex-items-center flex-justify-between';
      a.href=p['postUrl'];
      var left=document.createElement('span'); left.className='d-flex flex-items-center';
      var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('class','tool-icon'); svg.style.marginRight='8px'; svg.setAttribute('viewBox','0 0 16 16');
      var path=document.createElementNS('http://www.w3.org/2000/svg','path'); path.setAttribute('d',ICON_POST);
      svg.appendChild(path);
      var t=document.createElement('span'); t.className='listTitle'; t.textContent=p['postTitle'];
      left.appendChild(svg); left.appendChild(t);
      var right=document.createElement('span'); right.className='listLabels';
      (p['labels']||[]).forEach(function(label){
        var lb=document.createElement('span'); lb.className='Label LabelName';
        lb.style.background=(colors[label]||'#666'); lb.textContent=label; right.appendChild(lb);
      });
      var dt=document.createElement('span'); dt.className='Label LabelTime';
      dt.style.background=(p['dateLabelColor']||'#666'); dt.textContent=p['createdDate']; right.appendChild(dt);
      a.appendChild(left); a.appendChild(right); row.appendChild(a); list.appendChild(row);
    });
  }

  function updateShowTag(label){
    if(decodeURIComponent(window.location.hash.slice(1))!==label){
      window.location.hash='#'+encodeURIComponent(label);
      setClassDisplay(label);
    }
  }
  function setClassDisplay(label){
    var lists=document.getElementsByClassName('lists');
    var title=document.getElementsByClassName('tagTitle')[0];
    var input=document.getElementsByClassName('subnav-search-input')[0];
    input.value='';
    if(label==='All'||!label){
      title.textContent='All';
      document.title=SITE_TITLE;
      for(var i=0;i<lists.length;i++)lists[i].style.display='block';
      document.getElementById('notFind').style.display='none';
    }else if(tagList.indexOf(label)!==-1){
      title.textContent='Tag #'+label;
      document.title=label+' - '+SITE_TITLE;
      for(var i=0;i<lists.length;i++){lists[i].style.display=lists[i].classList.contains(label)?'block':'none';}
      document.getElementById('notFind').style.display='none';
    }else{
      input.value=label; searchShow();
    }
  }
  function searchShow(){
    var lists=document.getElementsByClassName('lists');
    var input=document.getElementsByClassName('subnav-search-input')[0];
    var q=input.value.trim();
    var title=document.getElementsByClassName('tagTitle')[0];
    title.textContent='Search #'+q;
    document.title=(q?q+' - ':'')+SITE_TITLE;
    if(q)window.location.hash='#'+encodeURIComponent(q);
    var term=q.toUpperCase(),hit=0;
    for(var i=0;i<lists.length;i++){
      var item=lists[i];
      var t=item.querySelector('.listTitle');
      var tt=(t?t.textContent:'')+' '+(item.children[0]?item.children[0].textContent:'');
      var ct=item.getAttribute('data-content')||'';
      if(tt.toUpperCase().indexOf(term)!==-1||ct.toUpperCase().indexOf(term)!==-1){item.style.display='block';hit++;}
      else item.style.display='none';
    }
    var nf=document.getElementById('notFind');
    if(hit===0&&q){nf.style.display='block';nf.textContent=I18N.notFind+' "'+q+'"';}
    else nf.style.display='none';
  }
  function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
  var ph=document.getElementById('pathHome'); if(ph&&ICON_POST)ph.setAttribute('d',"M6.906.664a1.749 1.749 0 0 1 2.187 0l5.25 4.2c.415.332.657.835.657 1.367v7.019A1.75 1.75 0 0 1 13.25 15h-3.5a.75.75 0 0 1-.75-.75V9H7v5.25a.75.75 0 0 1-.75.75h-3.5A1.75 1.75 0 0 1 1 13.25V6.23c0-.531.242-1.034.657-1.366l5.25-4.2Z");
</script>
{% endblock %}
