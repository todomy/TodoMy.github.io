<div id="footer1">Copyright © <span id="copyrightYear"></span> <a href="{{ blogBase['homeUrl']|e }}">{{ blogBase['title']|e }}</a></div>
<div id="footer2">
    {%- if blogBase['filingNum']!='' -%}
    <span id="filingNum"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">{{ blogBase['filingNum']|e }}</a> • </span>
    {%- endif %}
    <span id="runday"></span><span>Powered by <a href="https://meekdai.com/Gmeek.html" target="_blank" rel="noopener noreferrer">Gmeek</a></span>
</div>

<!-- 返回顶部按钮 -->
<div class="circle-button" role="button" aria-label="返回顶部" tabindex="0" onclick="scrollToTop()">↑</div>

{%- if blogBase['postTitle'] is defined %}
<!-- 返回上一页按钮 - 仅文章/阅读页显示；独立 class，不改动 .circle-button -->
<div class="back-button visible" title="返回上一页" role="button" aria-label="返回上一页" tabindex="0">←</div>
{%- endif %}

<script>
(function(){
    var now = new Date();
    document.getElementById("copyrightYear").textContent = now.getFullYear();

    if ({{ blogBase['startSite']|tojson }} != "") {
        var startSite = new Date({{ blogBase['startSite']|tojson }});
        var diff = now.getTime() - startSite.getTime();
        var diffDay = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById("runday").textContent = {{ i18n['run']|tojson }} + diffDay + {{ i18n['days']|tojson }} + " • ";
    }

    // 返回顶部
    function scrollToTop(){
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    window.scrollToTop = scrollToTop;

    // 按钮显隐
    var btn = document.querySelector('.circle-button');
    // 键盘可达：Enter/Space 触发返回顶部（与返回键写法一致）
    btn.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); scrollToTop(); }
    });
    window.addEventListener('scroll', function(){
        if (window.scrollY > 300) { btn.classList.add('visible'); }
        else { btn.classList.remove('visible'); }
    });

    // 返回上一页（方案C：站内来源用 history.back 保留滚动位置，外部/直达回首页）
    var backBtn = document.querySelector('.back-button');
    if (backBtn) {
        var goBack = function(){
            var home = {{ blogBase['homeUrl']|tojson }};
            var ref = document.referrer || '';
            var homeHost = '';
            try { homeHost = new URL(home).hostname; } catch (e) {}
            var refHost = '';
            if (ref) {
                try { refHost = new URL(ref).hostname; }
                catch (e) { refHost = ''; }
            }
            if (refHost && refHost === homeHost && window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = home;
            }
        };
        backBtn.addEventListener('click', goBack);
        backBtn.addEventListener('keydown', function(e){
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goBack(); }
        });
    }
})();
</script>
