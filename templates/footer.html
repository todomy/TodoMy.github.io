<style>
/* 页脚链接：样式只作用于页脚内部 */
#footer a{
    text-decoration: none;
    color: var(--color-accent-fg, #0969da);
    transition: font-weight 0.3s ease;
}
#footer a:hover{ font-weight: bold; }

/* 返回顶部按钮 - 简洁优雅版，配色跟随站点主题 */
.circle-button{
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 50px;
    height: 50px;
    background-color: var(--color-canvas-overlay, rgba(255,255,255,.9));
    color: var(--color-fg-default, #333);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    font-size: 22px;
    font-weight: 300;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
    border: 1px solid var(--color-border-default, transparent);
    transition: all 0.3s ease;
    opacity: 0;
    visibility: hidden;
    z-index: 9999;
}
.circle-button.visible{
    opacity: 1;
    visibility: visible;
}
.circle-button:hover{
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 8px 16px rgba(0,0,0,.15);
}
.circle-button:active{
    transform: translateY(-2px) scale(0.98);
    box-shadow: 0 4px 8px rgba(0,0,0,.12);
}
@media (max-width: 768px){
    .circle-button{
        width: 45px;
        height: 45px;
        font-size: 20px;
        bottom: 20px;
        right: 20px;
    }
}
</style>

<div id="footer1">Copyright © <span id="copyrightYear"></span> <a href="{{ blogBase['homeUrl']|e }}">{{ blogBase['title']|e }}</a></div>
<div id="footer2">
    {%- if blogBase['filingNum']!='' -%}
    <span id="filingNum"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">{{ blogBase['filingNum']|e }}</a> • </span>
    {%- endif %}
    <span id="runday"></span><span>Powered by <a href="https://meekdai.com/Gmeek.html" target="_blank" rel="noopener noreferrer">Gmeek</a></span>
</div>

<!-- 返回顶部按钮 -->
<div class="circle-button" onclick="scrollToTop()">↑</div>

<script>
(function(){
    var now = new Date();
    document.getElementById("copyrightYear").textContent = now.getFullYear();

    if ({{ blogBase['startSite']|tojson }} != "") {
        var startSite = new Date({{ blogBase['startSite']|tojson }});
        var diff = now.getTime() - startSite.getTime();
        var diffDay = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById("runday").textContent = {{ i18n['run']|tojson }} + diffDay + {{ i18n['days']|tojson }} + " • ";
    }

    // 返回顶部
    function scrollToTop(){
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    window.scrollToTop = scrollToTop;

    // 按钮显隐
    var btn = document.querySelector('.circle-button');
    window.addEventListener('scroll', function(){
        if (window.scrollY > 300) { btn.classList.add('visible'); }
        else { btn.classList.remove('visible'); }
    });
})();
</script>
