<style>
  .circle-button{position:fixed;right:30px;bottom:30px;width:50px;height:50px;border-radius:50%;
    background:rgba(255,255,255,.7);border:1px solid var(--color-border-default,#d0d7de);
    color:var(--color-fg-default,#24292f);font-size:20px;line-height:48px;text-align:center;
    cursor:pointer;z-index:9999;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;
    backdrop-filter:blur(4px)}
  .circle-button.visible{opacity:1;visibility:visible}
  @media(max-width:768px){.circle-button{width:45px;height:45px;right:20px;bottom:20px;line-height:43px}}
  #footer a:hover{font-weight:500}
</style>
<div>
  Copyright &copy; <span id="copyrightYear"></span> <a href="{{ homeUrl }}">{{ title }}</a>
  {% if filingNum != '' %} &bull; <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">{{ filingNum }}</a>{% endif %}
  {% if startSite != '' %} &bull; <span id="runday"></span>{% endif %}
  &bull; Powered by TodoMy-Next
</div>
<div class="circle-button" onclick="scrollToTop()" title="Top">&uarr;</div>
<script>
  (function(){
    var now=new Date();
    var y=document.getElementById('copyrightYear'); if(y){y.textContent=now.getFullYear();}
    var start="{{ startSite }}";
    if(start){
      var d=now.getTime()-new Date(start).getTime();
      var day=Math.floor(d/86400000);
      var r=document.getElementById('runday');
      if(r){r.textContent="{{ i18n['run'] }}"+day+"{{ i18n['days'] }}";}
    }
  })();
  function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});}
  window.addEventListener('scroll',function(){
    var b=document.querySelector('.circle-button');
    if(b){b.classList.toggle('visible',window.scrollY>300);}
  });
</script>
